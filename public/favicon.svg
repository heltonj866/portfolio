<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="silver-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="silver-text" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#050505"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#silver-border)" stroke-width="1.5"/>
  <!-- HJ Monogram -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Space Grotesk', sans-serif" font-size="26" font-weight="800" fill="url(#silver-text)" text-anchor="middle" letter-spacing="-1">HJ</text>
  <circle cx="51" cy="15" r="2.5" fill="#ffffff" opacity="0.9"/>
</svg>
